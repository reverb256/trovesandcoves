#!/usr/bin/env bash
# .github/workflows/kanban-ingest.yml
# Automatically import GitHub issues into Kanban board on issue creation/label change
name: Kanban Issue Ingest

on:
  issues:
    types: [opened, labeled, reopened]
  workflow_dispatch:
    inputs:
      repo:
        description: "Repository (owner/name)"
        required: false
        default: "reverb256/trovesandcoves"
        type: string

permissions:
  issues: read

jobs:
  ingest:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Hermes
        run: |
          curl -fsSL https://hermes-agent.nousresearch.com/install.sh | bash
          echo "$HOME/.hermes/bin" >> $GITHUB_PATH

      - name: Configure Hermes credentials
        env:
          HERMES_API_KEY: ${{ secrets.HERMES_API_KEY }}
        run: |
          hermes config set api_key "$HERMES_API_KEY"

      - name: Switch to trovesandcoves board
        run: hermes kanban boards switch trovesandcoves

      - name: Import issues
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.event.inputs.repo || 'reverb256/trovesandcoves' }}
        run: |
          gh issue list --repo "$REPO" --state open --label agent-ready --json number,title,body,labels --jq -r '.[] | @base64' | while read -r line; do
            decoded=$(echo "$line" | base64 -d)
            number=$(echo "$decoded" | jq -r '.number')
            title=$(echo "$decoded" | jq -r '.title')
            body=$(echo "$decoded" | jq -r '.body // "No description"')
            
            idempotency_key="gh-${REPO//\//-}-${number}"
            
            echo "Processing GH#$number: $title"
            
            # Check if already exists
            existing=$(hermes kanban list --json 2>/dev/null | jq -r ".[] | select(.body | contains(\"$idempotency_key\")) | .id" || echo "")
            
            if [ -z "$existing" ]; then
              hermes kanban create "$title" \
                --body "GitHub #$number — $body" \
                --assignee backend-eng \
                --idempotency-key "$idempotency_key" \
                --json
              echo "✓ Created task for GH#$number"
            else
              echo "⚠️ Task already exists for GH#$number"
            fi
          done

      - name: Report status
        run: hermes kanban list --status ready